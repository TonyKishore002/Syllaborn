<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle portal -->
  <circle cx="50" cy="50" r="44" stroke="url(#portalGrad)" stroke-width="3" fill="#0d0f18" filter="url(#glow)" />
  <circle cx="50" cy="50" r="38" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- Open Book -->
  <path d="M50 34 C58 26, 75 27, 80 32 L80 68 C75 63, 58 62, 50 70 Z" fill="#1c2038" stroke="#06b6d4" stroke-width="2" />
  <path d="M50 34 C42 26, 25 27, 20 32 L20 68 C25 63, 42 62, 50 70 Z" fill="#16192b" stroke="#8b5cf6" stroke-width="2" />
  <line x1="50" y1="34" x2="50" y2="70" stroke="#a855f7" stroke-width="2.5" />
  <!-- Portal Star in center -->
  <path d="M50 20 L53 30 L63 33 L53 36 L50 46 L47 36 L37 33 L47 30 Z" fill="url(#portalGrad)" filter="url(#glow)" />
  <!-- Sparks -->
  <circle cx="30" cy="22" r="1.5" fill="#22d3ee" />
  <circle cx="70" cy="22" r="1.5" fill="#f43f5e" />
  <circle cx="50" cy="78" r="2" fill="#a855f7" />
</svg>